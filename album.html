      <div class="sec-head">

        <p>Conferences, collaborations, seminars and everyday life in the lab.</p>
      </div>
      <div>
        <div class="alb-head">
          <div class="filter" id="alb-filter" role="group" aria-label="Filter by category"></div>
          <p class="mono count" id="alb-count" aria-live="polite"></p>
        </div>
        <div id="alb-out"></div>
        <dialog class="dlg" id="alb-dlg" aria-label="Photo">
          <form method="dialog"><button class="dlg-x" id="alb-dlg-x" aria-label="Close photo">×</button></form>

<script src="album.js"></script>
<script>
(function () {
  ITEMS.forEach(function (it, i) { it.n = i + 1; });

  var CATS = ['All', 'Lab life', 'Conferences', 'Collaborations', 'Seminars'];
  var current = 'All';
  var out = document.getElementById('alb-out');
  var filterEl = document.getElementById('alb-filter');
  var countEl = document.getElementById('alb-count');
  var dlg = document.getElementById('alb-dlg');
  var CAM = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h3.2l1.5-2h7.6l1.5 2h3.2v11h-17z"/><circle cx="12" cy="13" r="3.6"/></svg>';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function render() {
    var rows = ITEMS.filter(function (i) { return current === 'All' || i.cat === current; });
    out.className = 'alb-grid';
    out.innerHTML = rows.map(function (i) {
      var media = i.img
        ? '<img src="' + esc(i.img) + '" alt="' + esc(i.c) + '" loading="lazy" data-n="' + i.n + '">'
        : '<div class="alb-ph" role="img" aria-label="Photo to be added: ' + esc(i.c) + '"><span class="no">' + pad(i.n) + '</span>' + CAM + '</div>';
      return '<figure class="alb-item">' + media + '<figcaption><span class="cat">' + esc(i.cat) + '</span>' + esc(i.c) + '</figcaption></figure>';
    }).join('');
    countEl.textContent = rows.length + (rows.length === 1 ? ' photo' : ' photos');
    Array.prototype.forEach.call(filterEl.children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-c') === current));
    });
  }

  out.addEventListener('click', function (e) {
    var img = e.target.closest ? e.target.closest('img[data-n]') : null;
    if (!img || !dlg || typeof dlg.showModal !== 'function') return;
    var it = ITEMS[Number(img.getAttribute('data-n')) - 1];
    document.getElementById('alb-dlg-img').src = it.img;
    document.getElementById('alb-dlg-img').alt = it.c;
    document.getElementById('alb-dlg-cap').textContent = it.c;
    dlg.showModal();
  });
  if (dlg) dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'fbtn';
    b.id = 'alb-f-' + c.replace(/\s+/g, '-').toLowerCase();
    b.setAttribute('data-c', c);
    var n = c === 'All' ? ITEMS.length : ITEMS.filter(function (i) { return i.cat === c; }).length;
    b.textContent = c + ' · ' + n;
    b.addEventListener('click', function () { current = c; render(); });
    filterEl.appendChild(b);
  });
  render();
})();
</script>
</body>
</html>
